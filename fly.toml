# fly.toml app configuration for BattleBeasts Colyseus game-server
# Deploy from repo root:
#   fly launch --config fly.toml --dockerfile Dockerfile.game-server --no-deploy
#   fly secrets set SUPABASE_URL=... SUPABASE_SECRET_KEY=... ALLOW_GUESTS=true
#   fly deploy --config fly.toml --dockerfile Dockerfile.game-server

app = "battlebeasts-game"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.game-server"

[env]
  PORT = "2567"
  ALLOW_GUESTS = "true"
  NODE_ENV = "production"

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
